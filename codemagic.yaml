# Capture for iPhone. The Mac app is built and released by GitHub Actions
# (.github/workflows/release.yml); nothing here touches it. Analysis and
# tests run in the hard-eng GitHub check, so these workflows only build.
workflows:
  # Every pull request that changes more than the Mac app or documentation:
  # an unsigned simulator build of the app and its Control Centre extension.
  ios-validate:
    name: iPhone build
    instance_type: mac_mini_m2
    max_build_duration: 60
    when:
      changeset:
        includes:
          - '.'
        excludes:
          - 'macos/**'
          - '**/*.md'
    environment:
      flutter: 3.47.5
      xcode: latest
    triggering:
      events:
        - pull_request
      cancel_previous_builds: true
    scripts:
      - name: Dependencies
        script: flutter pub get --enforce-lockfile
      - name: Build for the simulator
        script: flutter build ios --simulator --debug

  # Started by each vX.Y.Z tag that the Mac release workflow publishes, or by
  # hand on a tag: signs the app and the extension for the App Store, builds
  # that version, submits it to TestFlight and App Store review in place of
  # any earlier submission, and releases it once Apple approves.
  ios-testflight:
    name: iPhone TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    integrations:
      app_store_connect: codemagic
    environment:
      flutter: 3.47.5
      xcode: latest
      ios_signing:
        distribution_type: app_store
        # Profiles are fetched for the app and com.afenso.capture.CaptureControls.
        bundle_identifier: com.afenso.capture
      vars:
        # The app's Apple ID from App Store Connect (App Information).
        APP_STORE_APPLE_ID: 6814996477
    scripts:
      - name: Dependencies
        script: flutter pub get --enforce-lockfile
      - name: Signing profiles
        script: xcode-project use-profiles
      # The release's What's New text, for the App Store and TestFlight.
      - name: What's New
        script: |
          if ! curl -fsSL -o release_notes.json \
            "https://github.com/sgaabdu4/capture/releases/download/${CM_TAG:-none}/release_notes.json"; then
            jq -n '[{language: "en-GB", text: "Bug fixes and improvements."}]' > release_notes.json
          fi
          cat release_notes.json
      - name: Build the IPA
        script: |
          version="${CM_TAG:-}"
          version="${version#v}"
          if [ -z "$version" ]; then
            version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          fi
          latest="$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" --all-versions)"
          flutter build ipa --release --build-name="$version" --build-number="$((latest + 1))" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        expire_build_submitted_for_review: true
        submit_to_app_store: true
        cancel_previous_submissions: true
        release_type: AFTER_APPROVAL
