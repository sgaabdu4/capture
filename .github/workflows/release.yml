name: Release

# Pull requests build and pack the DMG without publishing. Every merge to
# main builds Capture.app in the protected release environment and, once
# the Hard Eng check on the same commit has passed, signs it with the
# Developer ID certificate, notarises it and publishes it as the latest
# GitHub release with the Sparkle feed the app checks for updates. Without
# the signing secrets the release stays ad-hoc signed and has no feed.
# Changes to documentation alone (top-level Markdown and plans) build and
# publish nothing; the required dmg check still reports so the PR can merge.
on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Compare the changed files.
    outputs:
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Look for changes beyond documentation
        id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          files="$(git diff --name-only "$BASE" HEAD)"
          if printf '%s\n' "$files" | grep -Eqiv '^([^/]*\.md|features/.*/plan\.md)$'; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only documentation changed: nothing to build or publish."
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  dmg:
    name: dmg
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ${{ needs.changes.outputs.app == 'true' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read # Check out the pull request.
    steps:
      - name: Nothing to build
        if: needs.changes.outputs.app != 'true'
        run: echo "Only documentation changed, so there is no DMG to build."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.app == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        if: needs.changes.outputs.app == 'true'
        with:
          version: latest
          runtime: node@latest
          install: false
      - name: Build Capture.app
        if: needs.changes.outputs.app == 'true'
        run: |
          pnpm dlx --allow-build=@jdxcode/mise --package=@jdxcode/mise@latest mise --no-config install flutter@latest &&
          pnpm dlx --allow-build=@jdxcode/mise --package=@jdxcode/mise@latest mise --no-config exec flutter@latest -- flutter build macos --release
      - name: Pack the DMG
        if: needs.changes.outputs.app == 'true'
        run: |
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          cp -R build/macos/Build/Products/Release/Capture.app "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname Capture -srcfolder "$stage" -ov -format UDZO "$RUNNER_TEMP/Capture.dmg"
          hdiutil verify "$RUNNER_TEMP/Capture.dmg"

  release:
    name: release
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write # Create the release and upload the DMG.
      checks: read # Wait for the hard-eng check on this commit.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: latest
          runtime: node@latest
          install: false
      - name: Build Capture.app
        env:
          RUN: ${{ github.run_number }}
        # The run number is the build number Sparkle compares.
        run: |
          pnpm dlx --allow-build=@jdxcode/mise --package=@jdxcode/mise@latest mise --no-config install flutter@latest &&
          pnpm dlx --allow-build=@jdxcode/mise --package=@jdxcode/mise@latest mise --no-config exec flutter@latest -- flutter build macos --release --build-number="$RUN"
      - name: Wait for the hard-eng check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          for _ in $(seq 60); do
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=hard-eng" --jq '.check_runs[0].conclusion // ""')"
            case "$conclusion" in
              success) exit 0 ;;
              "") sleep 20 ;;
              *) echo "hard-eng finished as $conclusion; not publishing."; exit 1 ;;
            esac
          done
          echo "hard-eng did not finish within 20 minutes; not publishing."
          exit 1
      - name: Sign with the Developer ID certificate
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE" ]; then
            echo "No MACOS_CERTIFICATE secret: the release stays ad-hoc signed."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -n 1)"
          if [ -z "$identity" ]; then
            echo "MACOS_CERTIFICATE holds no Developer ID Application identity."
            exit 1
          fi
          app=build/macos/Build/Products/Release/Capture.app
          # Nested code first: Sparkle's helpers, then every framework, then
          # the app with its entitlements, which name its bundle identifier.
          sparkle="$app/Contents/Frameworks/Sparkle.framework/Versions/B"
          for helper in XPCServices/Installer.xpc XPCServices/Downloader.xpc Autoupdate Updater.app; do
            codesign --force --timestamp --options runtime --preserve-metadata=entitlements \
              --sign "$identity" "$sparkle/$helper"
          done
          find "$app/Contents/Frameworks" -depth \( -name '*.framework' -o -name '*.dylib' \) -print0 |
            xargs -0 -I {} codesign --force --timestamp --options runtime --sign "$identity" {}
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Contents/Info.plist")"
          sed "s/\$(PRODUCT_BUNDLE_IDENTIFIER)/$bundle_id/g" macos/Runner/Release.entitlements > "$RUNNER_TEMP/app.entitlements"
          codesign --force --timestamp --options runtime \
            --entitlements "$RUNNER_TEMP/app.entitlements" --sign "$identity" "$app"
          codesign --verify --deep --strict "$app"
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Pack the DMG
        run: |
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          cp -R build/macos/Build/Products/Release/Capture.app "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname Capture -srcfolder "$stage" -ov -format UDZO "$RUNNER_TEMP/Capture.dmg"
          if [ -n "${SIGN_IDENTITY:-}" ]; then
            codesign --force --timestamp --sign "$SIGN_IDENTITY" "$RUNNER_TEMP/Capture.dmg"
          fi
          hdiutil verify "$RUNNER_TEMP/Capture.dmg"
      - name: Notarise the DMG
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          if [ -z "${SIGN_IDENTITY:-}" ] || [ -z "$NOTARY_KEY" ]; then
            echo "Not signed with Developer ID or no NOTARY_KEY secret: skipping notarisation."
            exit 0
          fi
          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s\n' "$NOTARY_KEY" > "$key"
          xcrun notarytool submit "$RUNNER_TEMP/Capture.dmg" \
            --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --wait
          rm "$key"
          xcrun stapler staple "$RUNNER_TEMP/Capture.dmg"
          echo "NOTARISED=true" >> "$GITHUB_ENV"
      - name: Name the DMG
        env:
          RUN: ${{ github.run_number }}
        run: |
          version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          name="${version}-alpha.${RUN}"
          mkdir "$RUNNER_TEMP/release"
          mv "$RUNNER_TEMP/Capture.dmg" "$RUNNER_TEMP/release/Capture-${name}.dmg"
          echo "RELEASE_NAME=$name" >> "$GITHUB_ENV"
      - name: Write the update feed
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        # Only notarised builds go in the feed the app installs from.
        run: |
          if [ "${NOTARISED:-}" != true ] || [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "Not notarised or no SPARKLE_PRIVATE_KEY secret: no update feed."
            exit 0
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" |
            build/macos/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast --ed-key-file - \
              --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/v${RELEASE_NAME}/" \
              -o "$RUNNER_TEMP/release/appcast.xml" "$RUNNER_TEMP/release"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          name="$RELEASE_NAME"
          {
            echo "Built from main by the Release workflow; the Hard Eng checks passed on this commit."
            echo
            echo "Install: open the DMG and drag Capture into Applications."
            echo
            if [ "${NOTARISED:-}" = true ]; then
              echo "Signed with a Developer ID and notarised by Apple."
            else
              echo "This build is not notarised. The first time you open it, macOS says it cannot check the app. Open System Settings, then Privacy & Security, and choose Open Anyway for Capture."
            fi
          } > "$RUNNER_TEMP/notes.md"
          gh release create "v${name}" "$RUNNER_TEMP/release/"* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --latest \
            --title "Capture ${name}" \
            --notes-file "$RUNNER_TEMP/notes.md"
      - name: Remove the signing keychain
        if: always()
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          if [ -f "$keychain" ]; then
            security delete-keychain "$keychain"
          fi
