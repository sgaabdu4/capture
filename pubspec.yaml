name: capture
description: "Capture: private voice capture for macOS that files notes and tasks into Notion."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  capture_native:
    path: packages/capture_native
  http: ^1.6.0
  timezone: ^0.11.1
  sherpa_onnx: ^1.13.8
  path_provider: ^2.1.6
  flutter_secure_storage: ^11.2.0
  sqlite3: ^3.6.0
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  http_parser: ^4.1.2
  crypto: ^3.0.7
  flutter_riverpod: 3.4.3
  riverpod_annotation: 4.0.7
  freezed_annotation: 3.1.0
  go_router: ^18.0.1
  flutter_localizations:
    sdk: flutter
  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.1
  riverpod_generator: 4.0.9
  freezed: 4.0.1
  go_router_builder: 4.5.0
  build_runner: 2.16.1
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat.ttf
    - family: Patrick Hand
      fonts:
        - asset: assets/fonts/PatrickHand-Regular.ttf
