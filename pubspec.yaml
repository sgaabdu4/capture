name: capture
description: "Capture: private voice capture for macOS that files notes and tasks into Notion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  http: ^1.6.0
  timezone: ^0.11.2
  sherpa_onnx: ^2.0.1
  flutter_secure_storage: ^11.2.0
  sqlite3: ^3.8.0
  flutter_local_notifications: ^23.0.0
  flutter_timezone: ^5.1.1
  http_parser: ^4.1.2
  crypto: ^3.0.7
  flutter_riverpod: 3.5.0
  riverpod_annotation: 4.0.8
  freezed_annotation: 3.1.0
  go_router: ^18.0.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  json_annotation: ^4.12.0
  material_ui: ^1.11.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: ^1.31.1
  riverpod_generator: 4.0.10
  freezed: 4.0.3
  go_router_builder: 4.5.3
  build_runner: 2.17.1
  json_serializable: 6.15.2
  mocktail: ^1.0.5
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/tutorial/
  fonts:
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat.ttf
    - family: Patrick Hand
      fonts:
        - asset: assets/fonts/PatrickHand-Regular.ttf
